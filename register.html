  <a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
  <main id="main-content" class="account-layout"><section class="account-aside"><p class="eyebrow">Join the movement</p><h1>Make your next step <em>count.</em></h1><p>Create an account for faster checkout, order updates and early notice of every new release.</p></section><section class="account-form-wrap"><h2>Create account.</h2><p>Welcome to the circle.</p><form class="account-form" data-account-form="register"><div class="form-grid"><label><span class="field-label">First name</span><input class="field" required autocomplete="given-name"></label><label><span class="field-label">Last name</span><input class="field" required autocomplete="family-name"></label></div><label class="form-row"><span class="field-label">Email address</span><input class="field" type="email" required autocomplete="email" placeholder="you@example.com"></label><label class="form-row"><span class="field-label">Password</span><input class="field" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label class="checkbox-label"><input type="checkbox" required> I agree to the privacy policy and terms of service.</label><button class="button button--full" type="submit">Create account</button></form><p class="account-switch">Already part of the GEMI WEARS circle? <a href="login.html">Sign in</a></p></section></main><div id="site-footer"></div>
