<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Complete your GEMI WEARS order.">
  <title>GEMI WEARS | Checkout</title><link rel="icon" href="assets/brand/gemi-wears-logo.png" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
  <main id="main-content" class="shell checkout-page"><p class="breadcrumbs"><a href="index.html">Home</a><span>/</span><a href="cart.html">Your bag</a><span>/</span> Checkout</p><p class="eyebrow">A few final details</p><h1 class="section-heading">Secure <em>checkout.</em></h1>
    <div class="checkout-layout"><form data-checkout-form>
      <section class="checkout-section"><h2>Contact details</h2><div class="form-grid"><label><span class="field-label">Email address</span><input class="field" type="email" required autocomplete="email" placeholder="you@example.com"></label><label><span class="field-label">Phone number</span><input class="field" type="tel" required autocomplete="tel" placeholder="Your phone number"></label></div></section>
      <section class="checkout-section"><h2>Delivery address</h2><div class="form-grid"><label><span class="field-label">First name</span><input class="field" required autocomplete="given-name"></label><label><span class="field-label">Last name</span><input class="field" required autocomplete="family-name"></label><label class="full-width"><span class="field-label">Address</span><input class="field" required autocomplete="street-address" placeholder="House number and street"></label>
 <label>
  <span class="field-label">State / region</span>

  <select
    class="field"
    id="state"
    name="state"
    required
    autocomplete="address-level1"
    disabled
  >
    <option value="">Select country first</option>
  </select>
</label>

<label>
  <span class="field-label">Country</span>

  <select
    class="field"
    id="country"
    name="country"
    required
    autocomplete="country-name"
  >
    <option value="">Loading countries...</option>
  </select>
</label>
        <script>
document.addEventListener("DOMContentLoaded", async function () {

  const countrySelect = document.getElementById("country");
  const stateSelect = document.getElementById("state");

  if (!countrySelect || !stateSelect) {
    return;
  }

  try {

    const response = await fetch(
      "https://countriesnow.space/api/v0.1/countries/states"
    );

    if (!response.ok) {
      throw new Error("Could not load country data");
    }

    const result = await response.json();

    if (
      result.error ||
      !Array.isArray(result.data)
    ) {
      throw new Error("Invalid country data");
    }

    /* =========================
       LOAD ALL COUNTRIES
    ========================= */

    countrySelect.innerHTML =
      '<option value="">Select your country</option>';

    result.data.forEach(function (country) {

      const option =
        document.createElement("option");

      option.value = country.name;
      option.textContent = country.name;

      countrySelect.appendChild(option);

    });


    /* =========================
       COUNTRY CHANGED
    ========================= */

    countrySelect.addEventListener(
      "change",
      function () {

        const selectedCountry =
          result.data.find(
            function (country) {
              return country.name === countrySelect.value;
            }
          );


        stateSelect.innerHTML =
          '<option value="">Select state / province</option>';


        if (!selectedCountry) {

          stateSelect.disabled = true;

          return;
        }


        /* =========================
           COUNTRY HAS NO STATES
        ========================= */

        if (
          !Array.isArray(selectedCountry.states) ||
          selectedCountry.states.length === 0
        ) {

          stateSelect.disabled = false;

          const option =
            document.createElement("option");

          option.value = "Not applicable";
          option.textContent =
            "Not applicable";

          stateSelect.appendChild(option);

          return;
        }


        /* =========================
           LOAD STATES
        ========================= */

        stateSelect.disabled = false;

        selectedCountry.states.forEach(
          function (state) {

            const option =
              document.createElement("option");

            option.value = state.name;
            option.textContent = state.name;

            stateSelect.appendChild(option);

          }
        );

      }
    );


  } catch (error) {

    console.error(
      "Country/state loading error:",
      error
    );

    countrySelect.innerHTML =
      '<option value="">Unable to load countries</option>';

    stateSelect.innerHTML =
      '<option value="">Select country first</option>';

    stateSelect.disabled = true;

  }

});
</script>
      <section class="checkout-section"><h2>Delivery method</h2><div class="radio-cards"><label class="radio-card"><span><input type="radio" name="delivery" value="nigeria" checked> <b>Standard delivery (Nigeria)</b><small>Estimated 2–5 business days. Shipping is calculated from your location.</small></span><b>Nigeria</b></label><label class="radio-card"><span><input type="radio" name="delivery" value="worldwide"> <b>Worldwide shipping</b><small>Estimated 5–10 business days, depending on destination. Shipping is calculated from your country.</small></span><b>Global</b></label></div></section>
      <section class="checkout-section"><h2>Payment method</h2><div class="radio-cards">
        <label class="radio-card payment-card"><span class="payment-choice"><input type="radio" name="payment" value="paystack" checked><span class="payment-icon payment-icon--paystack" aria-hidden="true">P</span><span class="payment-copy"><b>Paystack</b><small>Secure payments powered by Paystack.</small></span></span><span class="payment-badges"><i>Secure</i></span></label>
      </div><p class="payment-help">Secure payments powered by Paystack.</p><button class="button" type="submit" style="margin-top:25px">Place order</button></section>
    </form><div data-checkout-summary></div></div>
  </main><div id="site-footer"></div>
  <script defer src="js/products.js"></script><script defer src="js/store.js"></script><script defer src="js/main.js"></script><script src="https://js.paystack.co/v2/inline.js"></script>
</body></html>
