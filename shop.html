<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Shop G.E.M.I. footwear, apparel and accessories.">
  <title>G.E.M.I. | Shop</title><link rel="icon" href="assets/brand/gemi-wears-logo.png" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div>
  <main id="main-content"><section class="page-banner"><div class="shell"><p class="breadcrumbs"><a href="index.html">Home</a><span>/</span> Shop</p><h1>Designed to <em>stand out.</em></h1><p>Discover GEMI WEARS footwear, hoodies, tees, joggers, shorts and denim.</p></div></section>
    <div class="shell shop-layout"><aside class="shop-filters" aria-label="Product filters"><h2 class="filter-title">Filter by</h2><div class="filter-group"><h3>Category</h3><label class="filter-option"><input type="checkbox" value="Shoes" data-category-filter> Shoes</label><label class="filter-option"><input type="checkbox" value="Hoodies" data-category-filter> Hoodies</label><label class="filter-option"><input type="checkbox" value="T-Shirts" data-category-filter> T-Shirts</label><label class="filter-option"><input type="checkbox" value="Joggers" data-category-filter> Joggers</label><label class="filter-option"><input type="checkbox" value="Shorts" data-category-filter> Shorts</label><label class="filter-option"><input type="checkbox" value="Denim" data-category-filter> Denim</label></div><div class="filter-group"><h3>Availability</h3><p style="margin:0;color:#aaa7a1;font-size:12px">Pieces without an uploaded image are marked Coming Soon.</p></div></aside>
      <section id="collections"><div class="shop-toolbar"><p class="result-count" data-result-count></p><label><span class="sr-only" style="position:absolute;left:-999px">Sort products</span><select class="sort-select" data-sort><option value="featured">Sort: Featured</option><option value="price-low">Price: Low to high</option><option value="price-high">Price: High to low</option><option value="name">Name: A–Z</option></select></label></div><div class="product-grid shop-grid" data-shop-grid></div></section>
    </div>
  </main><div id="site-footer"></div>
  <script defer src="js/products.js"></script><script defer src="js/store.js"></script><script defer src="js/main.js"></script>
</body></html>
